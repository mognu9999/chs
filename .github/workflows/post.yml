name: vk-post

on:
  schedule:
    # Запускаем в :17, скрипт ставит пост в отложку ВК ровно на :39
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Публикация
        run: python post.py
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Сохранить историю
        run: |
          git config user.name "bot"
          git config user.email "bot@://github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "history" && git pull --rebase && git push)
