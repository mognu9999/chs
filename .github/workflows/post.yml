name: vk-post
on:
  schedule:
    - cron: "0 */4 * * *"   # UTC: 0,4,8,12,16,20 (по МСК это 3,7,11,15,19,23)
  workflow_dispatch:         # кнопка ручного запуска для теста

permissions:
  contents: write

concurrency: vk-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Шрифты и cairo
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libcairo2
      - run: pip install -r requirements.txt
      - name: Публикация
        run: python post.py
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
      - name: Сохранить историю
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "history" && git push)
