name: vk-post

on:
  schedule:
    # Вокруг каждого слота (чётные часы UTC, :29): основной запуск за 2 минуты до слота
    # и два запасных, если GitHub опоздал или пропустил основной. Лишние запуски ничего не делают.
    - cron: "27 */2 * * *"
    - cron: "44 */2 * * *"
    - cron: "4 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      diag:
        description: "Диагностика токена VK (ничего не публикует)"
        type: boolean
        default: false

permissions:
  contents: write

# Запуски не пересекаются
concurrency:
  group: vk-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Публикация
        run: python post.py
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          DIAG: ${{ inputs.diag && '1' || '0' }}
      - name: Сохранить историю
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet && exit 0
          git commit -m "history"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
