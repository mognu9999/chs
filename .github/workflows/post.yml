name: vk-post

on:
  schedule:
    # Раз в час. Скрипт сам ставит в отложку VK записи на ближайшие ~20 часов
    # (слоты каждые 2 часа в :29 UTC), поэтому задержки очереди GitHub не страшны.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Два запуска одновременно не пересекаются
concurrency:
  group: vk-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Планирование публикаций
        run: python post.py
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
      - name: Сохранить историю
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet && exit 0
          git commit -m "history"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
