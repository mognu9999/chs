name: vk-post

on:
  schedule:
    # Каждые 2 часа в :07 по UTC. Публикация выходит в ближайшую минуту :09/:19/:29/:39/:49/:59.
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: vk-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Публикация
        run: python post.py
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
      - name: Сохранить историю
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "history" && git pull --rebase && git push)
